name: Deploy site & notes to GitHub Pages

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick if missing
        run: command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Cache shelf covers
        uses: actions/cache@v4
        with:
          path: ~/.cache/pxecore-shelf
          key: pxecore-shelf-${{ hashFiles('data/shelf.json') }}
          restore-keys: |
            pxecore-shelf-

      - name: Build shelf covers and data
        run: python3 scripts/build_shelf.py --cache-dir ~/.cache/pxecore-shelf

      - name: Build notes pages, OG cards, sitemap, and feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_notes_seo.py

      - name: Stage static site artifact
        run: |
          mkdir -p _site
          for item in index.html 404.html robots.txt ident.txt google19151367b7f47be3.html \
            sitemap.xml feed.xml llms.txt llms-full.txt .nojekyll \
            css fonts media script notes vendor .well-known; do
            [ -e "$item" ] && cp -a "$item" _site/
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
