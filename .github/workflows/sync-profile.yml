name: Auto Sync X (Twitter) Avatar & Banner

on:
  schedule:
    # Runs once every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify or install ffmpeg
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Run Profile Sync Script
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/sync_profile.py --force
          else
            python3 scripts/sync_profile.py
          fi

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain media/avatar.webp media/banner.webp media/.profile_sync.json 2>/dev/null)" ]; then
            git add media/avatar.webp media/banner.webp media/.profile_sync.json
            git commit -m "chore(profile): auto-sync X avatar & banner [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "Profile assets updated and pushed."
          else
            echo "No changes detected in profile assets."
          fi
